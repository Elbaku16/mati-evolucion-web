<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mati Evolución</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: #2e0d6e;
    }

    /* ── CAPA 1: Fondo real del menú (espacio + pasto integrado) ── */
    .fondo {
      position: fixed; inset: 0; z-index: 1;
      background-image: url('assets/fondo_menu.JPG');
      background-size: cover;
      background-position: center bottom;
    }

    /* ── CAPA 2: Planetas decorativos ── */
    .planeta-tl {
      position: fixed; top: -20px; left: -20px;
      width: clamp(140px, 20vw, 240px);
      z-index: 2;
      animation: flotar 7s ease-in-out infinite;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5));
    }
    .planeta-tr {
      position: fixed; top: 20px; right: 20px;
      width: clamp(100px, 14vw, 180px);
      z-index: 2;
      animation: flotar 9s ease-in-out infinite reverse;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.4));
    }
    .planeta-br {
      position: fixed; bottom: 160px; right: 50px;
      width: clamp(70px, 10vw, 130px);
      z-index: 4;
      animation: flotar 6s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    /* ── Cohete ── */
    .cohete {
      position: fixed; top: 10px; left: 50%;
      transform: translateX(-50%);
      width: clamp(55px, 7vw, 95px);
      z-index: 3;
      animation: flotarCohete 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* ── CAPA 3: Logo oficial ── */
    .logo {
      position: fixed; top: clamp(55px, 7vh, 95px);
      left: 50%; transform: translateX(-50%);
      width: clamp(260px, 42vw, 500px);
      z-index: 5;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
    }

    /* ── CAPA 4: Mati personaje — esquina inferior izquierda ── */
    .mati {
      position: fixed; bottom: 60px; left: clamp(0px, 2vw, 30px);
      width: clamp(130px, 18vw, 240px);
      z-index: 6;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      animation: flotar 5s ease-in-out infinite;
    }

    /* ── CAPA 5: Formulario — centro ligeramente abajo del logo ── */
    .form-wrap {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      margin-top: clamp(60px, 10vh, 110px);
      width: min(300px, 78vw);
      z-index: 7;
    }

    .input-wrap { position: relative; margin-bottom: 10px; }
    input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(10,0,60,0.55);
      backdrop-filter: blur(12px);
      color: #fff; font-size: 1rem;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      letter-spacing: 2px; outline: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: border 0.2s, background 0.2s;
      text-align: center;
    }
    input::placeholder { letter-spacing: 1px; color: rgba(255,255,255,0.5); font-weight: 600; }
    input:focus { border-color: rgba(255,255,255,0.75); background: rgba(10,0,80,0.7); }

    .btn-jugar {
      width: 100%; padding: 15px;
      border-radius: 50px; border: none;
      background: linear-gradient(to bottom, #fde047, #f59e0b);
      color: #78350f; font-size: 1.3rem;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      box-shadow: 0 6px 0 #92400e, 0 10px 24px rgba(245,158,11,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-jugar:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #92400e; }
    .btn-jugar:active { transform: translateY(3px); box-shadow: 0 2px 0 #92400e; }

    .error-box {
      background: rgba(239,68,68,0.3); border: 1px solid rgba(239,68,68,0.6);
      border-radius: 14px; color: #fca5a5;
      font-size: 0.82rem; padding: 8px 14px;
      margin-top: 8px; text-align: center; display: none;
    }
    .loading-txt { color: #fff; font-size: 0.82rem; margin-top: 8px; text-align: center; display: none; }

    .link-admin {
      position: fixed; bottom: 6px; right: 14px; z-index: 20;
      color: rgba(255,255,255,0.18); font-size: 0.65rem;
      text-decoration: none; font-family: 'Nunito', sans-serif;
    }
    .link-admin:hover { color: rgba(255,255,255,0.5); }

    @keyframes flotar {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes flotarCohete {
      0%,100% { transform: translateX(-50%) translateY(0) rotate(-8deg); }
      50% { transform: translateX(-50%) translateY(-12px) rotate(-8deg); }
    }
  </style>
</head>
<body>

  <!-- CAPA 1: Fondo real del menú (espacio violeta + pasto verde) -->
  <div class="fondo"></div>

  <!-- CAPA 2: Planetas reales del juego -->
  <img src="assets/Planeta_2.png" class="planeta-tl" alt="">
  <img src="assets/Planeta_3.png" class="planeta-tr" alt="">
  <img src="assets/planeta_morado.png" class="planeta-br" alt="">

  <!-- Cohete real del juego -->
  <img src="assets/cohete_vertical.PNG" class="cohete" alt="">

  <!-- CAPA 3: Logo oficial del juego -->
  <img src="assets/titulo_oficial.png" class="logo" alt="Mati Evolución">

  <!-- CAPA 4: Mati personaje — esquina inferior izquierda -->
  <img src="assets/mati_frente.PNG" class="mati" alt="">

  <!-- CAPA 5: Formulario -->
  <div class="form-wrap">
    <input type="password" id="clave" placeholder="Escribe la clave de acceso" maxlength="30" autocomplete="off">
    <button class="btn-jugar" onclick="verificar()">¡A jugar!</button>
    <div class="error-box" id="error">Clave incorrecta. Pide la clave a tu maestro.</div>
    <div class="loading-txt" id="loading">Verificando...</div>
  </div>

  <a href="admin.html" class="link-admin">Maestros</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZmreqSAs9ZqDfZk8jyPk-zu34Uz_mn3E",
      authDomain: "mati-evolucion.firebaseapp.com",
      databaseURL: "https://mati-evolucion-default-rtdb.firebaseio.com",
      projectId: "mati-evolucion",
      storageBucket: "mati-evolucion.firebasestorage.app",
      messagingSenderId: "480449181652",
      appId: "1:480449181652:web:e256a47a295d4e44d20841"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.verificar = async function() {
      const clave = document.getElementById('clave').value.trim();
      if (!clave) return;
      document.getElementById('error').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      try {
        const snap = await get(ref(db, 'claves/ninos'));
        document.getElementById('loading').style.display = 'none';
        if (clave === snap.val()) {
          window.location.href = 'game.html';
        } else {
          document.getElementById('error').style.display = 'block';
        }
      } catch {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = 'Error de conexión. Verifica el internet.';
        document.getElementById('error').style.display = 'block';
      }
    };

    document.getElementById('clave').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.verificar();
    });
  </script>
</body>
</html>
