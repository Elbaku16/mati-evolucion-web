<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mati Evolución</title>
  <link rel="stylesheet" href="composicion.css?v=5">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: #2e0d6e;
    }

    .fondo {
      position: fixed; inset: 0; z-index: 1;
      background-image: url('assets/fondo_menu.JPG');
      background-size: cover;
      background-position: center bottom;
    }

    /* ── Formulario: estilos visuales (posición en composicion.css) ── */
    input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(10,0,60,0.65);
      backdrop-filter: blur(14px);
      color: #fff; font-size: 1rem;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      letter-spacing: 2px; outline: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: border 0.2s, background 0.2s;
      text-align: center;
      display: block;
    }
    input::placeholder { letter-spacing: 1px; color: rgba(255,255,255,0.5); font-weight: 600; }
    input:focus { border-color: rgba(255,255,255,0.75); background: rgba(10,0,80,0.75); }

    .btn-jugar {
      width: 100%; padding: 15px;
      border-radius: 50px; border: none;
      background: linear-gradient(to bottom, #fde047, #f59e0b);
      color: #78350f; font-size: 1.3rem;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      box-shadow: 0 6px 0 #92400e, 0 10px 24px rgba(245,158,11,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      display: block;
    }
    .btn-jugar:hover  { transform: translateY(-2px); box-shadow: 0 8px 0 #92400e; }
    .btn-jugar:active { transform: translateY(3px);  box-shadow: 0 2px 0 #92400e; }

    .pie {
      text-align: center; color: rgba(255,255,255,0.65);
      font-size: 0.8rem; margin-top: 12px; font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .error-box {
      background: rgba(239,68,68,0.3); border: 1px solid rgba(239,68,68,0.6);
      border-radius: 14px; color: #fca5a5; font-size: 0.82rem;
      padding: 8px 14px; margin-top: 10px; text-align: center; display: none;
    }
    .loading-txt { color: #fff; font-size: 0.82rem; margin-top: 10px; text-align: center; display: none; }

    .link-admin {
      position: fixed; bottom: 6px; right: 14px; z-index: 20;
      color: rgba(255,255,255,0.18); font-size: 0.65rem;
      text-decoration: none; font-family: 'Nunito', sans-serif;
    }
    .link-admin:hover { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <div class="fondo"></div>

  <!-- Planeta azul: esquina superior izquierda, visible completo -->
  <img src="assets/Planeta_2.png"       class="planeta-tl"  alt="">

  <!-- Planeta morado: esquina superior derecha, visible completo -->
  <img src="assets/planeta_morado.png"  class="planeta-tr"  alt="">

  <!-- Planeta hielo: lateral derecho, decorativo -->
  <img src="assets/planeta_hielo.png"   class="planeta-mid" alt="">

  <!-- Cohete: superior derecho, separado del logo -->
  <img src="assets/cohete_vertical.PNG" class="cohete"       alt="">

  <!-- Logotipo oficial -->
  <img src="assets/titulo_oficial.png"  class="logo"         alt="Mati Evolución">

  <!-- Mati: inferior izquierda, mirando a la derecha (scaleX en composicion.css) -->
  <img src="assets/mati_frente.PNG"     class="mati"         alt="">

  <!-- Formulario de acceso -->
  <div class="form-wrap">
    <input type="password" id="clave" placeholder="Escribe la clave de acceso" maxlength="30" autocomplete="off">
    <button class="btn-jugar" onclick="verificar()">¡A jugar!</button>
    <div class="error-box"   id="error">Clave incorrecta. Pide la clave a tu maestro.</div>
    <div class="loading-txt" id="loading">Verificando...</div>
    <div class="pie">¿Listo para explorar?</div>
  </div>

  <a href="admin.html" class="link-admin">Maestros</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZmreqSAs9ZqDfZk8jyPk-zu34Uz_mn3E",
      authDomain: "mati-evolucion.firebaseapp.com",
      databaseURL: "https://mati-evolucion-default-rtdb.firebaseio.com",
      projectId: "mati-evolucion",
      storageBucket: "mati-evolucion.firebasestorage.app",
      messagingSenderId: "480449181652",
      appId: "1:480449181652:web:e256a47a295d4e44d20841"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    window.verificar = async function() {
      const clave = document.getElementById('clave').value.trim();
      if (!clave) return;
      document.getElementById('error').style.display   = 'none';
      document.getElementById('loading').style.display = 'block';
      try {
        const snap = await get(ref(db, 'claves/ninos'));
        document.getElementById('loading').style.display = 'none';
        if (clave === snap.val()) {
          window.location.href = 'game.html';
        } else {
          document.getElementById('error').style.display = 'block';
        }
      } catch {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent     = 'Error de conexión. Verifica el internet.';
        document.getElementById('error').style.display   = 'block';
      }
    };

    document.getElementById('clave').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.verificar();
    });
  </script>
</body>
</html>
